<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOLENA -- Real-World Impression</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../warm-stone-tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-secondary); font-family: var(--font-sans); color: var(--text-primary); padding: 40px; }
  .wordmark-block { font-family: var(--font-serif); font-weight: 400; letter-spacing: 10px; text-transform: uppercase; }
  .section { margin-bottom: 32px; }
  .section-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.55; margin-bottom: 12px; }
  .facade { width: 100%; max-width: 940px; height: 320px; border-radius: 3px; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #33261E 0%, #221a14 100%); }
  .facade::before { content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 64px); }
  .facade-entry { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 220px; height: 180px; background: rgba(245,239,230,0.06); border-top: 2px solid rgba(156,122,70,0.5); }
  .facade-wordmark { position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); font-family: var(--font-serif); font-weight: 400; font-size: 40px; letter-spacing: 12px; color: var(--earthy-terracotta); text-transform: uppercase; }
  .facade-rule { position: absolute; top: 58%; left: 50%; transform: translateX(-50%); width: 90px; height: 1px; background: var(--warm-brass); opacity: 0.8; }
  .reception-panel { width: 100%; max-width: 640px; height: 220px; border-radius: 3px; background: var(--bg-primary);
    box-shadow: inset 0 0 0 1px rgba(46,36,28,0.06), 0 2px 24px rgba(46,36,28,0.1);
    display: flex; align-items: center; justify-content: center; }
  .reception-panel .wordmark-block { font-size: 34px; color: var(--text-primary); }
</style>
</head>
<body>
<div class="section">
  <div class="section-label">SOLENA -- Exterior entrance</div>
  <div class="facade"><div class="facade-entry"></div><div class="facade-wordmark">SOLENA</div>
    <div class="facade-rule"></div></div>
</div>
<div class="section">
  <div class="section-label">SOLENA -- Reception</div>
  <div class="reception-panel"><div class="wordmark-block">SOLENA</div></div>
</div>
</body>
</html>
