<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Utilitarian favicon only  -  NOT the brand's monogram decision. monogram-test.html
       concluded no monogram is recommended for the core identity; a single-letter
       favicon is still a practical necessity at 16-32px browser-tab scale regardless,
       the same way most wordmark-only brands still ship a simple favicon glyph. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&amp;display=swap');
    .mono { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 36px; fill: #F5EFE6; }
  </style>
  <circle cx="32" cy="32" r="32" fill="#2E241C"/>
  <text x="32" y="45" text-anchor="middle" class="mono">E</text>
</svg>
