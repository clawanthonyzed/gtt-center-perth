<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160">
  <!-- ELOWEN wordmark  -  reversed on Deep Walnut. Same type parameters as wordmark.svg. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&amp;display=swap');
    .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 72px; letter-spacing: 10px; fill: #FAF6EE; }
    .rule { stroke: #9C7A46; stroke-width: 1; }
  </style>
  <rect width="720" height="160" fill="#33261E"/>
  <text x="360" y="95" text-anchor="middle" class="wordmark">ELOWEN</text>
  <line x1="280" y1="120" x2="440" y2="120" class="rule"/>
</svg>
