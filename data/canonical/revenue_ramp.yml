    notes: "AM ceiling A$55,000, ancillary included (A$8,580/yr), same 43/64/79/93/100% shape. Full historical figures retained in the source document, not migrated here."

  - id: historical_pm_session_ramp
    name: "PM session-count ramp (4/8/12/15/16 sessions/day, docs/pm-staffing-roster.md)"
    status: SUPERSEDED
    superseded_by: null  # genuinely conflicting, not a direct predecessor of ramp_table*_records above -- see conflicts below
    source: {file: docs/pm-staffing-roster.md, section: "PM Revenue -- Individual Services"}
    notes: >
      Already canonical as rev_pm_session_ramp_historical in revenue_assumptions.yml -- not
      duplicated here. Mathematically equals 25%/50%/75%/93.75%/100% of the 16-session
      steady-state PM capacity -- internally coherent on its own terms, but NOT the curve this
      file's PM revenue figures use (which reuse the blanket 43/64/79/93/100% shape instead,
      matching how docs/profit-loss-tables.md's own P&L ramp table actually calculated PM
      revenue, not how pm-staffing-roster.md's separate table did). See conflicts below.

# ============================================================
# Genuine, disclosed conflicts -- none silently resolved.
# ============================================================
conflicts:
  - id: conflict_pm_ramp_two_interpretations
    description: >
      Two historical documents present mutually inconsistent PM revenue ramps that both, on
      their own terms, correctly reproduce a different source document. docs/pm-staffing-roster.md
      states PM sessions ramp 4->8->12->15->16/day (= 25%/50%/75%/93.75%/100% of the 16-session
      steady-state capacity) and its own "Monthly PM Revenue" column (A$8,360/16,720/25,080/
      31,350/33,440) matches session_count x A$95 x 22 days exactly. docs/profit-loss-tables.md's
      own Year 1 Monthly Ramp table instead applies the SAME blanket 43/64/79/93/100% curve used
      for AM revenue directly to the PM steady-state ceiling (A$33,440), giving DIFFERENT Month
      1-4 PM revenue figures (A$14,380/21,400/26,420/31,100 -- only Month 5+ agrees, since both
      converge on the same 16-session ceiling). Neither document cross-references the other or
      discloses the discrepancy. This file's ramp_table*_records above use the blanket-curve
      interpretation (matching the actual P&L revenue tables, not the separate staffing-hours
      table) -- a disclosed methodology choice for REVENUE specifically, not a resolution of
      which ramp is "correct" for staffing/payroll purposes, which remains a separate, unresolved
      question this phase does not address.
    affected_records: [ramp_table1_m1, ramp_table1_m2, ramp_table1_m3, ramp_table1_m4, ramp_table2_m1, ramp_table2_m2, ramp_table2_m3, ramp_table2_m4, historical_pm_session_ramp]
    sources:
      - {file: docs/pm-staffing-roster.md, section: "PM Revenue -- Individual Services"}
      - {file: docs/profit-loss-tables.md, section: "Year 1 Monthly Ramp"}
    resolution_status: UNRESOLVED
    notes: "New finding, this phase (2026-08-09) -- neither prior canonical-data phase cross-compared these two tables' actual dollar figures against each other, only their existence was previously noted (rev_pm_session_ramp_historical's own notes flagged this as a 'plausible distinction, not confirmed'). See docs/architecture/REVENUE-RAMP-METHODOLOGY.md §5 for full detail."

  - id: conflict_ramp_curve_origin_unknown
    description: >
      The 43/64/79/93/100% ramp-percentage shape itself has no stated derivation anywhere in
      this repo -- no external benchmark, no client-acquisition-rate model, no stated reasoning
      for why these specific 5 numbers (vs. a linear ramp, a different curve shape, or a
      shorter/longer ramp period). It is used consistently, but consistency is not the same as a
      documented basis.
    affected_records: [ramp_curve_reused_historical]
    sources:
      - {file: docs/cash-flow.md, section: "18-Month Monthly Ramp (Rebuilt to Current Model)"}
    resolution_status: UNRESOLVED
    notes: "Not a new finding -- this repo has never stated where this curve came from, at any point in its history. Reused here as the least-arbitrary available option (an established convention, not an invented one), not because its own origin has been resolved."
