# GTT Center Perth -- Canonical Revenue Ramp (Month 1-5+), proof of concept, Phase 7
#
# Rebuilds the venture's Month 1-5+ revenue ramp using the CANONICAL revenue
# methodology (docs/architecture/CANONICAL-REVENUE-METHODOLOGY.md, adopted
# 2026-08-09), NOT the inherited historical delta-built figures. Every value
# below is produced deterministically by tools/revenue_ramp_model.py from
# canonical inputs (scenarios.yml, client_assumptions.yml, pricing.yml,
# revenue_assumptions.yml) -- reproduced exactly by tests/test_revenue_ramp.py.
#
# The ramp-percentage shape itself (43/64/79/93/100%) is a REUSED historical
# planning convention, not independently re-derived this phase -- see
# tools/revenue_ramp_model.py's RAMP_CURVE constant and
# docs/architecture/REVENUE-RAMP-METHODOLOGY.md for the full investigation,
# including a genuine, disclosed conflict with a second historical PM ramp
# (docs/pm-staffing-roster.md's 4/8/12/15/16 session-count table) that this
# file does NOT use for revenue -- see `conflicts` below.
#
# Both Table 1 and Table 2 are represented in full. Neither is marked primary,
# per docs/VERIFICATION-TRACKER.md item 1m (still unresolved) and this repo's
# existing scenarios.yml convention (is_primary: false for both).
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.

schema_version: 1
dataset: revenue_ramp
last_updated: "2026-08-09"

# The one modelling choice this file makes: which ramp-percentage curve to
# apply. Recorded once here rather than repeated in every month record.
ramp_curve:
  id: ramp_curve_reused_historical
  name: "Reused historical ramp-percentage shape (Month 1-5+)"
  value: {month_1: 43, month_2: 64, month_3: 79, month_4: 93, month_5_plus: 100}
  unit: "% of steady-state revenue"
  status: MODELLED
  status_detail: >
    Not independently re-derived or externally benchmarked this phase -- reused because it is
    the ONLY ramp curve this repo has ever used, applied identically to AM and PM revenue in
    every one of 3 separate documents (docs/cash-flow.md, docs/profit-loss-tables.md,
    docs/investor-memorandum.md). Applying it to the NEW canonical revenue bases (which include
    PM Saturday for the first time -- the historical ramp tables never modelled Saturday PM at
    all) is a genuine, disclosed extension, not a re-verification. See
    docs/architecture/REVENUE-RAMP-METHODOLOGY.md §3-4 for the full investigation and the
    mathematical proof that applying this same % to AM and PM independently is equivalent to
    applying it to Total Revenue directly (both additive components share one scalar).
  applies_to: ["am_revenue", "pm_revenue"]
  does_not_apply_to: ["ancillary_revenue -- stays A$0 throughout per rev_ancillary_excluded_from_baseline, does not ramp"]
  source: {file: docs/profit-loss-tables.md, section: "Year 1 Monthly Ramp"}
  also_see:
    - {file: docs/cash-flow.md, section: "18-Month Monthly Ramp (Rebuilt to Current Model)"}
    - {file: docs/investor-memorandum.md, section: "3. Financial Projections, AM GTT Revenue -- Monthly Ramp"}
  notes: "Same 43/64/79/93/100% shape independently confirmed identical in all 3 sources above (see also_see) -- primary source picked as the most detailed of the three. Superseded curve this replaces for CALCULATION purposes: none -- the historical curve's shape (the percentages themselves) is reused as-is, only the BASE it's applied to changes (canonical Table 1/Table 2 totals instead of the old inherited 12-client/10-client ceilings)."

