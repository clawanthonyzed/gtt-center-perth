# ============================================================
# Genuine, disclosed conflicts -- none silently resolved.
# ============================================================
conflicts:
  - id: conflict_am_labor_ramp_unmodelled
    description: >
      AM Direct Labor (weekday FTE, A$48,254.67/month) and AM Saturday Direct Labor
      (hours-based, scenario-specific) are both treated as FIXED from Month 1 in this file --
      i.e. NOT ramped down during Months 1-4 despite lower actual booking volume during ramp-up.
      This is because (a) weekday AM staff are explicitly FTE/fixed-salary roles, hired for
      DESIGN CEILING capacity regardless of actual daily volume (docs/CURRENT-STATE.md §5:
      "UNCHANGED... FTE-based, same 8+2 headcount"), and (b) while a genuine "daily rostering"
      reduced-headcount option exists in this repo (7 staff instead of 8, Massage+Beauty pool
      capped at 3) for lower-volume days, staffing.yml's own staff_treatment_massage_beauty_pool
      record explicitly flags this has NOT been independently re-verified against Table 1/Table
      2's 25-min cadence -- so it cannot safely be applied here without inventing an unconfirmed
      staffing methodology. Saturday AM labor's "scales with volume" language in this repo refers
      to scaling between DIFFERENT COMMITTED SCENARIOS (12-client vs 18-client), not a
      month-to-month ramp-up methodology within one scenario, which does not exist anywhere in
      this repo.
    affected_records: [cost_table1_m1, cost_table1_m2, cost_table1_m3, cost_table1_m4, cost_table1_m5plus, cost_table2_m1, cost_table2_m2, cost_table2_m3, cost_table2_m4, cost_table2_m5plus]
    sources:
      - {file: docs/CURRENT-STATE.md, section: "§5 Monthly Net P&L"}
      - {file: data/canonical/staffing.yml, section: "staff_treatment_massage_beauty_pool"}
    resolution_status: UNRESOLVED
    notes: "A conservative treatment (overstates Months 1-4 payroll cost relative to a hypothetical reduced-headcount ramp) -- flagged explicitly, not silently assumed to be the only possible or most accurate treatment. See docs/architecture/COST-RAMP-METHODOLOGY.md §4."

  - id: conflict_direct_labor_reconciliation_gap
    description: >
      This file's from-first-principles Direct Labor + Opening Costs total at Month 5+
      (A$79,679.63 Table 1 / A$76,188.04 Table 2) does not exactly match
      docs/CURRENT-STATE.md §5's own stated headline figures (A$79,433.05 / A$75,941.47) -- a
      consistent A$246.57-246.58/month (~0.3%) gap, identical in both scenarios. Root cause:
      this file's "Receptionist/relief/workers comp" component is taken at face value from
      docs/profit-loss-tables.md's own Appendix (~A$339.00/day, itself marked "~=" approximate
      in the source, not an exact figure) rather than back-solved to force an exact match --
      consistent with this repo's established "do not force reconciliation to the old numbers"
      practice (same treatment already applied to the A$2,576.36 revenue-reconciliation gap).
    affected_records: [cost_table1_m5plus, cost_table2_m5plus]
    sources:
      - {file: docs/CURRENT-STATE.md, section: "§5 Monthly Net P&L"}
      - {file: docs/profit-loss-tables.md, section: "Appendix -- How Every Figure Is Calculated"}
    resolution_status: UNRESOLVED
    notes: "Small in magnitude (~0.3%) but disclosed per this repo's established governance practice, not silently absorbed. See docs/architecture/COST-RAMP-METHODOLOGY.md §7-8."

  - id: conflict_table2_opening_increment_unresolved
    description: >
      docs/VERIFICATION-TRACKER.md item 1o (pre-existing, not newly found) -- whether the
      A$44.50/day opening-time increment (sourced specifically to a 07:00 start) should still
      apply to Table 2's 08:00 start remains unresolved. This file includes it unchanged for
      Table 2, matching docs/CURRENT-STATE.md's own current treatment, not independently
      resolving the question.
    affected_records: [cost_table2_m1, cost_table2_m2, cost_table2_m3, cost_table2_m4, cost_table2_m5plus]
    sources:
      - {file: docs/CURRENT-STATE.md, section: "§5 Monthly Net P&L, Open item note below Table 2"}
    resolution_status: UNRESOLVED
    notes: "If resolved in Table 2's favour (increment does not apply), Table 2's true costs would be A$979.00/month lower than shown here in every month -- not applied, per the existing open tracker item."

  - id: conflict_variable_vs_fixed_classification_carried_forward
    description: >
      opex.yml's own conflict_variable_vs_fixed_classification (GTT supplies, general
      consumables, laundry/linen -- FIXED per docs/profit-loss-tables.md vs. VARIABLE per
      docs/unit-economics.md, historical) is carried forward into this file's fixed_costs
      total UNCHANGED (i.e. this file follows the status-quo FIXED classification for the
      PRIMARY calculation) -- not resolved here. See gtt_supplies_variable_alternative above
      for an exploratory, non-primary investigation of the VARIABLE alternative for GTT
      supplies specifically (the one component of the three with an unambiguous per-unit
      volume denominator -- AM client/test count). Consumables and laundry's own per-visit
      rates (docs/unit-economics.md) are tied to an ambiguous "total visits" denominator not
      cleanly defined anywhere in this repo's current canonical data -- NOT computed as a
      variable alternative this phase, to avoid inventing an undefined denominator.
    affected_records: [cost_table1_m1, cost_table1_m2, cost_table1_m3, cost_table1_m4, cost_table1_m5plus, cost_table2_m1, cost_table2_m2, cost_table2_m3, cost_table2_m4, cost_table2_m5plus]
    sources:
      - {file: docs/profit-loss-tables.md, section: "§4 Monthly, Non-Wage Overhead Component breakdown"}
      - {file: docs/unit-economics.md, section: "Variable Cost Per Visit"}
    resolution_status: UNRESOLVED
    notes: "See docs/architecture/COST-RAMP-METHODOLOGY.md §6 for the full investigation and why consumables/laundry could not safely be migrated to a variable alternative this phase."

  - id: conflict_superannuation_partial_coverage
    description: >
      Superannuation (12% of OTE, wages.yml#wage_superannuation_rate) is now applied to the
      phlebotomist AM-weekday portion, AM Saturday, and both PM Direct Labor components (all
      built from raw hourly award rates, which docs/financial-break-even-staff.md's own Award
      Wage Summary table treats as EXCLUSIVE of super) -- added 2026-08-09 (tracker item 46,
      resolved). It is NOT applied to the 8 treatment staff's AM-weekday portion (already
      includes super, per that same table's explicit "incl. super" labelling on 6 of 7 roles),
      and NOT applied to the Opening-Time Increment or Receptionist/Relief Pool components,
      since neither is a role-specific wage figure with a known super treatment -- the
      Receptionist/Relief figure in particular is itself only an approximate, bundled
      "~A$339.00/day" figure (see conflict_direct_labor_reconciliation_gap), not cleanly
      decomposable back to the Receptionist's own "incl. super" annual salary. This remaining
      gap is disclosed, not resolved: if the Receptionist's own wage component (embedded
      somewhere inside the bundled Receptionist/Relief figure) does NOT already include super
      via that bundling, this file's superannuation total would still be a modest
      underestimate.
    affected_records: [cost_table1_m1, cost_table1_m2, cost_table1_m3, cost_table1_m4, cost_table1_m5plus, cost_table2_m1, cost_table2_m2, cost_table2_m3, cost_table2_m4, cost_table2_m5plus]
    sources:
      - {file: docs/financial-break-even-staff.md, section: "Award Wage Summary (Effective 1 July 2025)"}
      - {file: data/canonical/wages.yml, section: "wage_superannuation_rate"}
    resolution_status: UNRESOLVED
    notes: "Eligibility rule (e.g. any minimum-earnings threshold) is also not stated anywhere in this repo -- the 12% rate is applied universally to every super-exclusive wage component above, not independently verified against current Australian SG eligibility rules. See docs/architecture/COST-RAMP-METHODOLOGY.md §5a and docs/VERIFICATION-TRACKER.md item 46."
