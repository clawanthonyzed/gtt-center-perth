# The one genuine ramp-methodology choice this file makes for PAYROLL:
# reusing the PM session-count ramp (already-canonical
# revenue_assumptions.yml#rev_pm_session_ramp_historical), NOT the blanket
# revenue-ramp curve -- see docs/architecture/COST-RAMP-METHODOLOGY.md §5.
payroll_ramp_curve:
  id: payroll_ramp_pm_session_count
  name: "PM Direct Labor ramp -- session-count based, 3-hour casual-minimum-engagement floor applied"
  value: {month_1: 4, month_2: 8, month_3: 12, month_4: 15, month_5_plus: 16}
  unit: "PM sessions/day, feeding the hours-based casual costing formula"
  status: MODELLED
  status_detail: >
    Reused from revenue_assumptions.yml#rev_pm_session_ramp_historical (docs/pm-staffing-roster.md's
    own PM staffing table), NOT the blanket 43/64/79/93/100% revenue-ramp curve reused in
    revenue_ramp.yml. Justified because PM labor cost is a DIRECT function of session count via
    docs/pm-staffing-roster.md's own hours-based costing formula (hours/role/day = sessions/day
    / 4 roles / 1.3 sessions/hr throughput), whereas the blanket curve was built for, and matches,
    PM REVENUE specifically (docs/profit-loss-tables.md's own P&L ramp table) -- confirmed in
    docs/architecture/REVENUE-RAMP-METHODOLOGY.md §5 to be a mutually-inconsistent, not
    interchangeable, curve for PM revenue. Applying the session-count curve to PM LABOR
    specifically (its most plausible original purpose, per that same investigation) is a
    disclosed, reasoned choice, not an arbitrary substitution.
  applies_to: ["pm_weekday_direct_labor"]
  does_not_apply_to: [
    "am_weekday_direct_labor -- FTE/fixed-salary, does not ramp, see conflict_am_labor_ramp_unmodelled",
    "am_saturday_direct_labor -- fixed at the scenario's committed level throughout, see conflict_am_labor_ramp_unmodelled",
    "pm_saturday_direct_labor -- already below the 3-hour floor at full steady-state volume, so mathematically constant regardless of any session-count assumption",
    "opening_time_increment, receptionist_relief -- fixed operational costs, not session-volume-dependent",
  ]
  source: {file: docs/pm-staffing-roster.md, section: "PM Revenue -- Individual Services"}
  notes: "The 3-hour casual-minimum-engagement floor (wages.yml#wage_casual_minimum_engagement, VERIFIED) means Months 1-4 all produce the IDENTICAL PM weekday labor cost (A$435.78/day) -- 4, 8, 12, and 15 sessions/day are all below the floor threshold (16 sessions/4 roles/1.3 throughput = 3.08hrs/role, barely above; anything less falls under 3.0hrs and is floored). Only Month 5+ (16 sessions) clears the floor and reaches the higher, canonical A$440.00/day figure. This is a genuine, disclosed finding, not previously computed anywhere in this repo -- see COST-RAMP-METHODOLOGY.md §5."

