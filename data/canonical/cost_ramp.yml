# ============================================================
# Genuine, disclosed conflicts -- none silently resolved.
# ============================================================
conflicts:
  - id: conflict_am_labor_ramp_unmodelled
    description: >
      AM Direct Labor (weekday FTE, A$48,254.67/month) and AM Saturday Direct Labor
      (hours-based, scenario-specific) are both treated as FIXED from Month 1 in this file --
      i.e. NOT ramped down during Months 1-4 despite lower actual booking volume during ramp-up.
      This is because (a) weekday AM staff are explicitly FTE/fixed-salary roles, hired for
      DESIGN CEILING capacity regardless of actual daily volume (docs/CURRENT-STATE.md §5:
      "UNCHANGED... FTE-based, same 8+2 headcount"), and (b) while a genuine "daily rostering"
      reduced-headcount option exists in this repo (7 staff instead of 8, Massage+Beauty pool
      capped at 3) for lower-volume days, staffing.yml's own staff_treatment_massage_beauty_pool
      record explicitly flags this has NOT been independently re-verified against Table 1/Table
      2's 25-min cadence -- so it cannot safely be applied here without inventing an unconfirmed
      staffing methodology. Saturday AM labor's "scales with volume" language in this repo refers
      to scaling between DIFFERENT COMMITTED SCENARIOS (12-client vs 18-client), not a
      month-to-month ramp-up methodology within one scenario, which does not exist anywhere in
      this repo.
