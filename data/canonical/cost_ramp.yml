# GTT Center Perth -- Canonical Cost Ramp (Month 1-5+), proof of concept, Phase 8
# (superannuation added Phase 9 resume, 2026-08-09 -- see below)
#
# The cost-side counterpart to revenue_ramp.yml. Deterministically computed by
# tools/cost_ramp_model.py from canonical inputs (client_assumptions.yml,
# scenarios.yml, opex.yml, staffing.yml, wages.yml) plus a small set of named,
# individually-cited payroll constants sourced directly to
# docs/profit-loss-tables.md's own "Appendix -- How Every Figure Is
# Calculated" and docs/CURRENT-STATE.md §5 -- reproduced exactly by
# tests/test_cost_ramp.py. Full investigation, methodology, and every
# disclosed conflict/limitation: docs/architecture/COST-RAMP-METHODOLOGY.md.
#
# SUPERANNUATION (added 2026-08-09, resolving docs/VERIFICATION-TRACKER.md item
# 46): wages.yml#wage_superannuation_rate (12% of OTE) is now applied to every
# payroll_breakdown below -- but NOT uniformly. docs/financial-break-even-staff.md's
# own Award Wage Summary table explicitly labels 6 of 7 roles' annual salary
# figures "incl. super" (the 8 treatment staff) but NOT the Phlebotomist row --
# a real, disclosed asymmetry in the source, not invented here. See
# tools/cost_ramp_model.py's SUPERANNUATION_RATE_PCT constant for the full
# sourced reasoning, and conflict_superannuation_partial_coverage below for the
# remaining unresolved portion (Opening-Time Increment, Receptionist/Relief).
#
# Does NOT calculate Net P&L, break-even, or any figure requiring revenue to
# be netted against costs -- cost side only, per the coordinator's explicit
# financial-model boundary for this phase.
#
# Both Table 1 and Table 2 are represented in full. Neither is marked
# primary, per docs/VERIFICATION-TRACKER.md item 1m (still unresolved) and
# this repo's existing scenarios.yml convention (is_primary: false for both).
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.

