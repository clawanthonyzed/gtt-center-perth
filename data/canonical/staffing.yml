# GTT Center Perth -- Canonical Staffing Data (proof of concept, Phase 2)
#
# Populated from docs/CURRENT-STATE.md §4 (canonical headcount), cross-checked against
# docs/financial-break-even-staff.md, docs/pm-staffing-roster.md, docs/hr-framework.md,
# docs/multirole-CORRECTION.md, and docs/VERIFICATION-TRACKER.md. No headcount, skill
# pairing, or shift assumption was invented -- every field traces to a named source, and
# genuinely unresolved fields are PLACEHOLDER, not guessed.
#
# Categories preserved per the coordinator's instruction: treatment / phlebotomy /
# management_admin / other (PM roster + relief pool) / scenario-specific.
#
# Table 1 (18 clients/day) vs. Table 2 (12 clients/day) -- per docs/CURRENT-STATE.md §4,
# AM treatment + phlebotomy headcount is IDENTICAL under both (a genuine, notable finding
# of the 2026-08-05 rebase, not an oversight of this file). Where headcount differs
# between scenarios (the historical 14-client ceiling), both are preserved, neither is
# chosen -- see historical_staffing_scenarios below.
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.
#
# UPDATED 2026-08-21 (Founder Decision round) -- staff_receptionist_manager
# (Position 06/RCO01, dedicated PM Reception) marked SUPERSEDED and removed
# from the committed payroll model, per Anthony's direct instruction:
# service-staff coverage during PM booking gaps (Model C) is now confirmed,
# overriding docs/architecture/STAFFING-COVERAGE-VALIDATION.md section 4's
# prior Model A recommendation. Fresha/payment-system training added as a
# real requirement to staff_pm_massage/staff_pm_hair/staff_pm_nail/
# staff_pm_beauty's own required_skills. Full financial propagation:
# data/canonical/cost_ramp.yml#change_pm_reception_dedicated_role_removed.

