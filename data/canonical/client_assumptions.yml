      Early-Release formulas, docs/investor-memorandum.md's capacity-ceiling line,
      docs/booking-service-capacity-rule.md) -- this record simply gives that pre-existing,
      repeatedly-applied convention its own canonical id for the first time, so the revenue
      formula can reference it rather than restating the bare number inline. No independent
      derivation of "why 22" (vs. the literal 52 weeks/year x 5 weekdays / 12 months = 21.67)
      is stated anywhere in this repo -- it reads as a standard rounded planning convention, not
      independently re-derived here.
