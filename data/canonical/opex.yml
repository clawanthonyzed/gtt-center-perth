# GTT Center Perth -- Canonical Non-Payroll Operating Expenses (proof of concept, Phase 3)
#
# Populated from docs/profit-loss-tables.md's Non-Wage Overhead breakdown (the table
# CURRENT-STATE.md's own "A$13,980.00, unchanged" figure is built from -- cross-checked
# arithmetically: all 13 line items below sum to exactly A$13,980.00), cross-referenced
# against docs/cash-flow.md, docs/rent-budget-2026-07-28.md, docs/financial-setup.md,
# docs/equipment-costs.md, docs/ivy-booking-system.md, and docs/unit-economics.md
# (historical, cited for a genuine classification-ambiguity finding, not as a current
# source). No amount was invented. Several genuine conflicts and gaps were found
# cross-referencing these documents against each other -- none silently resolved.
#
# Scope: NON-PAYROLL operating expenses only. Does not duplicate wages.yml (payroll,
# super, workers-comp RATE) except where the repo itself presents a cost inside an
# "Insurance" cost table alongside payroll-adjacent items (financial-setup.md Step 8
# bundles Workers Compensation with Public Liability/PI/Property/Business Interruption --
# recorded here as a cross-reference/reconciliation record against wages.yml's existing
# wage_workers_comp_rate, not a second source of truth for the same figure).
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.
#
# cost_type vocabulary (per the coordinator's Part 2 instruction, one field, 8 values):
# FIXED | VARIABLE | SEMI_VARIABLE | ONE_OFF | STARTUP | CAPEX | COGS | PAYROLL.
# A record classified STARTUP/CAPEX/COGS/PAYROLL here is recorded ONLY because the
# source document explicitly discusses it as an operating-adjacent cost worth
# cross-referencing -- it does not become part of this file's recurring-opex total,
# and is flagged in its own notes as "not opex, cross-referenced only."

