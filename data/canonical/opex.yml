    description: >
      docs/profit-loss-tables.md's modelled Non-Wage Overhead "Insurance (public liability + PI)"
      line is a flat A$400.00/month (A$4,800.00/year), already self-tagged PLACEHOLDER ("never
      an actual insurance quote"). docs/financial-setup.md STEP 8's own itemised insurance table
      (5 policy types: public liability, professional indemnity, workers compensation, property
      contents, business interruption) totals A$11,700-19,000/year -- 2.4x to 4x higher than the
      modelled figure, and covers 3 more policy types (workers comp, property, business
      interruption) that the modelled A$400/month figure does not claim to cover at all.
    affected_records: [opex_insurance_modelled, opex_insurance_public_liability, opex_insurance_professional_indemnity, opex_insurance_workers_comp_estimate, opex_insurance_property_contents, opex_insurance_business_interruption]
    sources:
      - {file: docs/profit-loss-tables.md, section: "§4 Monthly, Non-Wage Overhead Component breakdown"}
      - {file: docs/financial-setup.md, section: "STEP 8 -- INSURANCE"}
      - {file: docs/CURRENT-STATE.md, section: "§7.3 Working Capital & Pre-Launch Costs"}
