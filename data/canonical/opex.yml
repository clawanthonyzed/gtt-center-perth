    description: >
      Three different figures exist for the same decided platform (Fresha): the modelled P&L
      figure (A$100.00/month), the actual documented Fresha Team-plan pricing for the confirmed
      1-2 admin seats (A$14.95-29.90/month, materially LOWER), and a stale reference to a
