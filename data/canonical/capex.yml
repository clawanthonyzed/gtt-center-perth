conflicts:
  - id: conflict_summary_budget_vs_section_totals
    description: >
      docs/equipment-costs.md's own Summary Budget table does not exactly match its own
      per-section itemised totals for at least 3 categories: Pathology Collection Room
      (Summary Budget A$8,300-14,100 vs §1's own A$6,330-10,240, a pre-existing gap the source
      document itself discloses as "not investigated or reconciled this round"), Massage Rooms
      (Summary Budget A$4,000-10,000 vs §4's own A$2,925-7,400, NOT previously flagged anywhere
      in this repo), Lounge (Summary Budget A$5,000-15,000 vs §6's own A$8,620-19,850, also NOT
      previously flagged), and Technology (Summary Budget A$3,000-7,000 vs §8's own
      A$3,240-7,920, a smaller gap). This canonical-data pass used each section's own itemised
      total, not the Summary Budget row, for every record above -- consistent, but not
      resolving which figure (if either) is actually correct.
    affected_records: [capex_pathology_collection_room_equipment, capex_massage_room_equipment, capex_lounge_furniture, capex_technology_hardware]
    sources:
      - {file: docs/equipment-costs.md, section: "Summary Budget table"}
      - {file: docs/equipment-costs.md, section: "§1, §4, §6, §8 (individual section TOTAL rows)"}
    resolution_status: UNRESOLVED
    notes: "The Pathology gap was already disclosed by the source document itself; the Massage/Lounge/Technology gaps are new findings from this pass, not previously logged anywhere."

  - id: conflict_it_av_overlap
    description: >
      docs/floor-plan-concept.md's Fit-Out Cost Estimate carries a standalone "IT / AV (POS,
      booking tablets, TVs, music system)" line at A$5,000-12,000, itemised separately from
      its own "Equipment" line (which itself sources from docs/equipment-costs.md's Summary
      Budget, including that document's own Technology section). Whether this IT/AV line is
      genuinely additional technology spend (TVs, music system -- not itemised anywhere in
      equipment-costs.md) or a partial double-count of POS/tablet costs already counted once
      inside capex_technology_hardware is not resolved by either source document.
    affected_records: [capex_technology_hardware]
    sources:
      - {file: docs/floor-plan-concept.md, section: "Fit-Out Cost Estimate table"}
      - {file: docs/equipment-costs.md, section: "§8 Technology"}
    resolution_status: UNRESOLVED
    notes: "See docs/architecture/STARTUP-COST-RECONCILIATION.md for the full reconciliation-level discussion of this overlap and its effect on the overall startup-capital range."
