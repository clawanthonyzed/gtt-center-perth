# GTT Center Perth -- Canonical Capital Expenditure (proof of concept, Phase 4)
#
# Durable physical/IT assets only -- furniture, equipment, technology hardware. Does NOT
# include fit-out CONSTRUCTION (walls, partitions, electrical, plumbing, HVAC, flooring
# installation -- a leasehold-improvement cost, recorded in data/canonical/startup_costs.yml
# instead, per that file's own header note on the startup-vs-capex boundary), and does NOT
# include consumable/opening-stock supplies (oils, polish, forms -- recorded in
# startup_costs.yml's opening-inventory records instead).
#
# Sourced primarily from docs/equipment-costs.md, at the SAME section-level granularity
# already established as canonical in this repo (docs/CURRENT-STATE.md §7.1 sources its own
# "Equipment" line directly from docs/equipment-costs.md's own Summary Budget, which is
# itself organised by room/service section, not itemised down to every sharps-container
# bracket) -- this file mirrors that granularity rather than inventing a finer split the
# source repo doesn't itself maintain.
#
# CAPITAL-VS-CONSUMABLE SPLIT, disclosed honestly: only docs/equipment-costs.md §5A (Beauty/
# Brows) carries an explicit per-line "Type" column distinguishing Capital from Recurring/
# consumable -- for that section only, this file uses the isolated capital-only subtotal
# (computed directly from the source's own tagged rows, not invented: A$800+160+120+120+150+
# 200 = A$1,550 low; A$1,800+300+250+240+350+400 = A$3,340 high). Every other section
# (§1, §3, §4, §5, §6, §8, §11) bundles a small amount of consumable/opening-stock spend into
# one section total WITHOUT a line-by-line capital/consumable tag -- this file uses those
# section totals as-is (predominantly capital, per the source's own top-level "Capital vs
# Recurring Summary" framing) rather than inventing a line-by-line re-split the source itself
# does not provide.
#
# USEFUL LIFE / DEPRECIATION: not stated anywhere in this repo for any asset -- every record
# below has useful_life_years: null and depreciation_method: null, genuinely, not from
# oversight. Flagged once here rather than repeated as per-record noise.
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.

