  - id: conflict_lease_cost_overlap
    description: >
      docs/CURRENT-STATE.md §7.3's "Legal/entity setup, lease bond (~2 months' rent)"
      (A$19,600-27,600) may substantially overlap with docs/grace-startup-plan.md's separate
      "Legal and professional fees" (A$3,000-6,000) and "Lease deposit + first month"
      (A$5,000-15,000) lines -- combined, the grace-startup-plan.md pair (A$8,000-21,000) is
      close to but not identical to the CURRENT-STATE.md figure, and it is not clear whether
      these are the same underlying cost described two different ways, or genuinely additive
