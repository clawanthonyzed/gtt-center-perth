# GTT Center Perth -- Canonical Startup Costs (proof of concept, Phase 4)
#
# Non-capex, pre-opening cash outlay: fit-out CONSTRUCTION (leasehold improvement, not an
# individually-depreciable asset the way furniture/equipment is -- see data/canonical/
# capex.yml's own header for that boundary), legal/entity setup, lease-related costs,
# professional fees, opening inventory, and working capital. Sourced from
# docs/CURRENT-STATE.md §6/§7, docs/floor-plan-concept.md, docs/grace-startup-plan.md,
# docs/financial-setup.md, docs/equipment-costs.md, docs/investor-memorandum.md.
#
# PART 5 BOUNDARY, enforced throughout this file: startup EXPENDITURE (this file's `records`)
# is money spent to establish the business. WORKING CAPITAL (a distinct list below,
# `funding_requirements`, NOT `records`) is cash held in reserve to survive ramp-up -- a
# funding/cash requirement, not an expense line, per the coordinator's explicit instruction
# not to treat it as a cost automatically. CAPEX (durable assets) lives in capex.yml, not here.
# No final "total opening funding requirement" figure is calculated anywhere in this file --
# that would require combining startup expenditure + capex + opening inventory + pre-opening
# payroll + working capital + contingency, which the coordinator's Part 5 explicitly says not
# to do unless the repo already supports it directly (it doesn't -- see
# docs/architecture/STARTUP-COST-RECONCILIATION.md).
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.

