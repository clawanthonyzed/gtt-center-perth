conflicts:
  - id: conflict_ma000005_penalty_rates
    description: >
      MA000005 (Hair & Beauty Industry Award) Saturday/Sunday/Public Holiday penalty rates
      are stated THREE different ways across three documents in this repo:
      Saturday -- financial-break-even-staff.md 133%, HANDOFF.md 133% (permanent)/150%
      (casual), hr-framework.md 150% flat.
      Sunday -- financial-break-even-staff.md 200%, HANDOFF.md 200%, hr-framework.md 175%.
      Public Holiday -- financial-break-even-staff.md 250%, HANDOFF.md 250-275%,
      hr-framework.md 250%.
    affected_records: [wage_ma000005_saturday_penalty, wage_ma000005_sunday_penalty, wage_ma000005_public_holiday_penalty]
    sources:
      - {file: docs/financial-break-even-staff.md, section: "Award Wage Summary (Effective 1 July 2025)"}
      - {file: docs/HANDOFF.md, section: "Regulatory Findings (Confirmed, Sourced)"}
      - {file: docs/hr-framework.md, section: "Hair & Beauty Industry Award MA000005, Penalty rates"}
    resolution_status: UNRESOLVED
    notes: "None of the three cites a fetched primary source for the specific percentages (unlike wage_casual_minimum_engagement, which does). Flagged for a future session with award-interpretation/live-fetch capability -- do not pick one silently."

  - id: conflict_base_hourly_rates_vs_hr_framework
    description: >
      docs/financial-break-even-staff.md's base hourly rates (used for every current P&L
      calculation in this repo) are materially higher than docs/hr-framework.md's own
      "Indicative rate (2026)" figures for the same award levels -- e.g. MA000005 Level 4
      (Beauty/Massage): $29.60/hr (financial-break-even-staff.md) vs ~$24.89-26.56/hr
      (hr-framework.md, Levels 4-5); MA000005 Level 3 (Nails/Hair): $28.50/hr vs ~$23.49/hr.
    affected_records: [wage_beauty_therapist, wage_massage_therapist, wage_nail_technician, wage_hairdresser]
    sources:
      - {file: docs/financial-break-even-staff.md, section: "Award Wage Summary (Effective 1 July 2025)"}
      - {file: docs/hr-framework.md, section: "4. AWARD WAGE RATES (CURRENT -- VERIFY BEFORE ISSUING CONTRACTS)"}
    resolution_status: UNRESOLVED -- financial-break-even-staff.md's rates were used as the primary record above, since they are the ones CURRENT-STATE.md's own payroll totals are arithmetically traceable to (see this file's header). This is a "which figure the model currently runs on" choice, NOT a claim that financial-break-even-staff.md's rates are more accurate. hr-framework.md's own framing ("Indicative", "confirm before issuing contracts") suggests it may be the more cautious/placeholder-aware of the two, not necessarily the wrong one.
    notes: "Both documents are dated within the same repo era (financial-break-even-staff.md: 'Effective 1 July 2025'; hr-framework.md: 'Indicative (2026)') -- the gap is not obviously explained by a wage-review timing difference alone."

  - id: conflict_award_rate_staleness
    description: >
      Every wage rate in this file traces to a source stating "Effective 1 July 2025" or
      "Indicative (2026)". Today's date in this session is 2026-08-08 -- after the Fair
      Work Commission's typical annual wage review effective date (1 July each year,
      per docs/hr-framework.md's own note: "Fair Work Commission increases minimum wages
      annually (typically July 1)"). None of these rates has been re-checked against a
      possible 1 July 2026 Annual Wage Review outcome.
    affected_records: ["all wage_* records with a base/casual hourly_rate"]
    resolution_status: UNRESOLVED -- flagged as an explicit unresolved verification requirement, not silently assumed current or silently updated.
    notes: "This is a genuinely new finding from this pass, not previously logged in docs/VERIFICATION-TRACKER.md -- recommend adding a tracker item there in a future session (not done this pass, to stay within this phase's authorised file list)."
