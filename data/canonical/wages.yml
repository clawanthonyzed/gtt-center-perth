      2026-07-30]" -- a real external-source citation with a method and a date, not a bare
      assertion.
      (3) SUPPORTING/DISPUTING EVIDENCE IN THE REPO: supporting -- the rule was actively
      APPLIED to correct a real costing bug (docs/VERIFICATION-TRACKER.md item 1i: Saturday
      PM Direct Labor was understated at 1.54hrs/role/day before this 3-hour floor was
      correctly enforced, corrected to A$654.32/day from A$335.55/day). This is stronger
      evidence than a citation alone -- the rule was tested against a real number and
      changed a real output. No disputing evidence was found anywhere in this repo.
      (4) CAN IT SAFELY BE MARKED VERIFIED: yes, on the strength of the repo's own
