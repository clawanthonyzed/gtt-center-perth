# GTT Center Perth -- Canonical Service Catalogue (proof of concept, Phase 5)
#
# Complete service/treatment/product catalogue, not a representative slice. Sourced primarily
# from docs/services-pricing-locked.md ("locked pricing," Part A-E) and docs/services-master-table.md
# (Parts A-E, a more complete staff/qualification/price source that fills real gaps the
# "locked" document leaves unpriced), cross-checked against docs/extended-wellness-services.md,
# docs/pm-package-structure.md, docs/pm-staffing-roster.md, docs/hire-purchase-china.md,
# docs/market-research-findings.md.
#
# ARCHITECTURE DECISION (Part 6, "explain the relationship explicitly"): services.yml is the
# service catalogue/identity/commercial-definition layer; data/canonical/pricing.yml is the
# canonical PRICING layer. Where a service already has a canonical price record in pricing.yml
# (the 7 individual services + AM packages + PM packages/average migrated in Phase 1), this
# file references it via `pricing_ref` and does NOT restate the price -- one authoritative
# price, per the coordinator's explicit end-state goal. For the ~85 additional services found
# this phase that pricing.yml never covered (pricing.yml's own Phase 1 header explicitly
# deferred "the full a-la-carte menu, all durations/add-ons" to a later pass -- this is that
# pass), this file carries the price directly under each record's own `price` field, as the
# FIRST canonicalisation of that fact -- there is exactly one canonical record for each such
# service (here), just not yet homed in the file literally named pricing.yml. A future
# consolidation pass could migrate these `price` fields into pricing.yml proper and convert
# them to `pricing_ref` here, matching the original 7 -- flagged as a known follow-up, not
# attempted this phase (would not change any value, only which file stores it).
#
# LIFECYCLE field (Part 4, a NEW field, not a 7th governance status): current | proposed |
# historical | superseded. Governance `status` still uses the existing 7-value vocabulary for
# how confidently a FACT is known; `lifecycle` separately answers whether the SERVICE ITSELF is
# currently offered, proposed, historical, or superseded -- a current, actively-sold service can
# still have a MODELLED (not VERIFIED) price, and a historical/removed service can have a
# VERIFIED price (it really was priced at that figure, once).
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.

