# GTT Center Perth -- Canonical Revenue Assumptions (proof of concept, Phase 6)
#
# The assumptions layer connecting services.yml + pricing.yml + client_assumptions.yml +
# scenarios.yml into a traceable revenue picture -- NOT a revenue model or forecast. Per the
# coordinator's explicit Part 2 instruction: where a figure is already canonical elsewhere
# (client volume in scenarios.yml/client_assumptions.yml, price in pricing.yml/services.yml),
# this file REFERENCES it by id (`scenario_ref`, `service_ref`, `pricing_ref`) rather than
# restating it -- new records here are limited to genuinely new facts not captured anywhere
# else in the canonical layer (Saturday PM session count, PM theoretical capacity, ramp
# curves, ancillary-revenue historical figures, discount/leakage policy, and the
# revenue-reconstruction traceability records).
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.
#
# METHODOLOGY UPDATE (2026-08-09, per Anthony's direct decision): the days-based
# first-principles revenue formula (client_volume x price x operating_days, summed across
# AM/PM x weekday/Saturday) is now the CANONICAL revenue methodology going forward --
# see docs/architecture/CANONICAL-REVENUE-METHODOLOGY.md for the full formula and worked
# examples. `rev_reconstruction_table1_monthly` and `rev_reconstruction_table2_monthly`
# below (originally built last phase as a reconciliation CHECK against the historical
# delta-built figures) are now the venture's actual canonical Total Revenue figures for
# Table 1/Table 2, not merely a check. The historical delta-built figures they were checked
# against (A$157,792.16 / A$118,297.16, themselves inherited from an untraceable original
# A$113,712.16 baseline -- see docs/architecture/REVENUE-RECONCILIATION-INVESTIGATION.md)
# are preserved below as their own explicit HISTORICAL/INHERITED records
# (`rev_historical_table1_monthly_inherited` / `rev_historical_table2_monthly_inherited`),
# not deleted or silently dropped -- this repo's history is never rewritten, per
# rules/CLAUDE.md companion rule 1.

