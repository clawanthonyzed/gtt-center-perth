# ============================================================
# Genuine, disclosed conflicts -- none silently resolved.
# ============================================================
conflicts:
  - id: conflict_superannuation_not_in_cost_ramp
    description: >
      Superannuation (wages.yml#wage_superannuation_rate, 12% of OTE, MODELLED) is not included
      anywhere in cost_ramp.yml's own payroll_costs total, and was not included in any historical
      P&L figure in this repo either (docs/CURRENT-STATE.md §5's own Total Direct Labor + Opening
      Costs / Workers Comp / Total Costs lines make no mention of superannuation). This appears to
      be a genuine, previously-unnoticed gap across this venture's entire financial modelling
