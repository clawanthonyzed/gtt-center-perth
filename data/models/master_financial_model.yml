# GTT Center Perth -- Master Financial Model, Phase 9
#
# Combines the canonical revenue methodology (docs/architecture/CANONICAL-REVENUE-METHODOLOGY.md),
# revenue_ramp.yml, and cost_ramp.yml into a 24-month P&L, basic cash flow, break-even,
# scenario comparison, and sensitivity analysis. Deterministically generated by
# tools/master_financial_model.py -- every revenue/cost figure below traces to a
# data/canonical/revenue_ramp.yml or data/canonical/cost_ramp.yml record by id, not a
# second, hidden calculation. Reproduced exactly by tests/test_master_financial_model.py.
#
# Priority order for this phase, per the coordinator's explicit instruction: correctness >
# traceability > reproducibility > transparency > scenario separation > auditability >
# presentation (presentation is explicitly out of scope this phase).
#
# Does NOT calculate: EBITDA, EBIT (undefined terms in this repo), opening funding
# requirement, NPV, IRR, investor return. Does NOT choose Table 1 or Table 2 as primary.
#
# Full detail, worked examples, and every disclosed limitation:
# docs/architecture/MASTER-FINANCIAL-MODEL-METHODOLOGY.md
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.

schema_version: 1
dataset: master_financial_model
last_updated: "2026-08-09"

model_config:
  canonical_inputs_consumed:
    - data/canonical/revenue_ramp.yml   # M1-M5plus revenue by scenario -- the ONLY revenue source
    - data/canonical/cost_ramp.yml       # M1-M5plus costs by scenario -- the ONLY cost source
    - data/canonical/scenarios.yml       # client_volume, is_primary (both false, unchanged)
    - data/canonical/pricing.yml         # am_price_used_for_revenue -- break-even/sensitivity only
    - data/canonical/client_assumptions.yml  # operating_days_per_month_weekday/operating_saturdays_per_month
    - data/canonical/wages.yml           # wage_superannuation_rate -- the one new supplementary line
    - data/canonical/opex.yml            # insurance sensitivity only (conflict_insurance_estimate)
    - data/canonical/startup_costs.yml   # startup section -- ranges only, not chosen
    - data/canonical/capex.yml           # capex section -- ranges only, not chosen
  scope_boundary: >
    This model calculates a P&L, a basic (accrual-proxy) cash flow, a break-even, scenario
    comparison, and sensitivity analysis. It does NOT produce Excel/PDF/Word/dashboard outputs
    (a later, separately-authorised phase), does NOT choose a primary scenario, does NOT resolve
    any existing unresolved tracker item, and does NOT invent an opening funding requirement.
  neither_scenario_primary: true
  scenario_primacy_pending: "docs/VERIFICATION-TRACKER.md item 1m -- unchanged, not resolved by this phase"

# ============================================================
# ASSUMPTIONS -- the modelling choices THIS phase makes, each named, cited,
# and status-tagged, per the coordinator's explicit "expose unresolved
# assumptions" instruction. None of these resolves an existing tracker item.
# ============================================================
assumptions:
  - id: assumption_24month_extension_flat
    name: "Months 6-24 held flat at Month 5+ (canonical steady state) -- no growth invented"
    status: DECIDED
    status_detail: >
      Per the coordinator's explicit instruction for this phase: "Do NOT invent growth after
      Month 5 -- if there's no documented growth assumption past Month 5, keep revenue flat at
      canonical steady-state through Month 24." No document anywhere in this repo states a
      post-Month-5 growth curve. This is a disclosed absence of an invented assumption, not a
      claim that the venture will not grow.
    source: {file: docs/architecture/CANONICAL-REVENUE-METHODOLOGY.md, section: "§18 Status of the Methodology"}
    notes: "Applies identically to both revenue (revenue_ramp.yml has no Month 6+ record) and costs (cost_ramp.yml, same)."

  - id: assumption_superannuation_supplementary
    name: "SUPERSEDED 2026-08-09 -- superannuation is no longer a supplementary line, see assumption_superannuation_canonical"
    status: SUPERSEDED
    superseded_by: assumption_superannuation_canonical
    status_detail: >
      Phase 9's first pass computed superannuation as a disclosed, NON-primary supplementary
      line here in the model layer, because cost_ramp.yml did not yet include it anywhere.
      RESOLVED 2026-08-09 (docs/VERIFICATION-TRACKER.md item 46): superannuation is now
      implemented at the canonical cost/wage layer itself (data/canonical/wages.yml +
      data/canonical/cost_ramp.yml), not bolted onto this model -- see
      assumption_superannuation_canonical below. This record retained for trace only, per this
      repo's never-delete-history convention.
    source: {file: data/canonical/wages.yml, section: "wage_superannuation_rate"}
    notes: "Superseded, not deleted."

  - id: assumption_superannuation_canonical
    name: "Superannuation (12% OTE) implemented at the canonical cost/wage layer -- not a model-layer special case"
    status: MODELLED
    status_detail: >
      RESOLVED 2026-08-09 (docs/VERIFICATION-TRACKER.md item 46). Evidence:
      docs/financial-break-even-staff.md's Award Wage Summary table (lines 29-37) explicitly
      labels 6 of 7 roles' annual salary figures "incl. super" (Receptionist/Manager, Beauty
      therapist, Nail technician, Hairdresser, Massage therapist, PM Service Therapist) but NOT
      the Phlebotomist row ("A$43,068 (25hr/wk each)", no "incl. super" text) -- a real,
      disclosed asymmetry read directly off the source table, not inferred. Rate: 12% of
      Ordinary Time Earnings (wages.yml#wage_superannuation_rate, well-corroborated across 3
      internal documents). Treatment: super is ADDED to every payroll component built from the
      raw hourly `casual_loaded` award rate (AM Weekday Phlebotomist portion, AM Saturday, PM
      Weekday, PM Saturday -- all exclusive of super per the source table's structure) and NOT
      added to the AM Weekday Treatment Staff portion (already included, adding again would
      double-count). Opening-Time Increment and Receptionist/Relief Pool: super treatment
      genuinely unresolved (see cost_ramp.yml#conflict_superannuation_partial_coverage) -- no
      super applied to either, a disclosed, not invented, gap. Implemented in
      tools/cost_ramp_model.py (SUPERANNUATION_RATE_PCT) and flows through this model's
      `payroll` field automatically via cost_ramp.yml -- no special-case code in
      tools/master_financial_model.py.
    source: {file: docs/financial-break-even-staff.md, section: "Award Wage Summary (Effective 1 July 2025), lines 29-37"}
    notes: "Eligibility rule (minimum-earnings threshold, if any) not stated anywhere in this repo -- applied universally, not independently verified against current Australian SG eligibility rules."

  - id: assumption_cashflow_accrual_proxy
    name: "Cash flow uses net operating result as an accrual-basis proxy, NOT a true cash-basis forecast"
    status: DECIDED
    status_detail: >
      No debtor/creditor timing data (e.g. days-to-collect, days-to-pay-suppliers) exists anywhere
      in this repo. Per docs/onboarding.md's own cancellation policy, GTT package revenue is
      collected in full at time of booking -- a real, disclosed reason cash and accrual timing may
      be genuinely close for AM revenue specifically, but this has not been independently verified
      for PM revenue or any opex/payroll line. Flagged as a simplification, not asserted as
      accurate.
    source: {file: docs/onboarding.md, section: "Cancellation & Rescheduling Policy"}
    notes: "Startup expenditure and capex timing are NOT included in the cash flow -- no canonical per-month timing schedule exists for either (see startup_capex_section below)."

  - id: assumption_opening_cash_not_invented
    name: "Opening cash balance -- explicit, un-invented input, defaults to null"
    status: PLACEHOLDER
    status_detail: "No canonical source states an opening cash figure anywhere in this repo. tools/master_financial_model.py's compute_cash_flow() accepts opening_cash as an explicit parameter, defaulting to None -- when None, only cumulative net operating result is shown, not a true closing cash balance."
    source: null
    notes: "Per the coordinator's explicit instruction: 'don't invent a value.'"

  - id: assumption_breakeven_am_volume_only
    name: "Break-even computed as AM client-volume break-even only, not a contribution-margin break-even"
    status: DECIDED
    status_detail: >
      A traditional contribution-margin break-even (fixed costs / contribution margin %) is NOT
      computed -- nearly every cost in cost_ramp.yml is classified FIXED (including AM/PM payroll,
      which does not vary with actual booking volume in this model's current ramp treatment, see
      conflict_am_labor_ramp_unmodelled in cost_ramp.yml), and the one disputed classification
      (GTT supplies/consumables/laundry) remains unresolved. The AM client-volume break-even IS
      defensible because AM revenue specifically is a known, linear function of client volume
      (price x operating days) -- computable without resolving the disputed classification.
    source: {file: data/canonical/cost_ramp.yml, section: "conflict_variable_vs_fixed_classification_carried_forward"}
    notes: "See docs/architecture/MASTER-FINANCIAL-MODEL-METHODOLOGY.md §9 for the full reasoning."

  - id: assumption_sensitivity_payroll_not_flexed
    name: "Client-volume sensitivity does NOT flex payroll with client volume"
    status: DECIDED
    status_detail: "Matches the base case's own disclosed treatment (cost_ramp.yml's conflict_am_labor_ramp_unmodelled: AM labor is fixed from Month 1, not volume-responsive within a scenario) -- the sensitivity analysis does not invent a payroll-flex methodology the base case itself does not use, per the coordinator's explicit 'do not invent one if it doesn't exist' instruction."
    source: {file: data/canonical/cost_ramp.yml, section: "conflict_am_labor_ramp_unmodelled"}
    notes: null

