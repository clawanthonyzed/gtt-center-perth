# GTT Center Perth -- Master Financial Model, Phase 9
#
# REVERTED 2026-08-21 (Financial Model Rebuild round), per direct founder
# instruction: the relief_absence_allowance line added 2026-08-18 (below) is
# now 0.00 on every cost_ramp.yml record -- normal payroll/rostering is
# treated as already absorbing absence coverage (casual relief hiring, a
# colleague picking up an extra shift), not a separate expected-value
# planning line stacked on top of it, unless a genuine, itemised, real cost
# basis for a separate line is identified (none has been). Full reasoning:
# data/canonical/cost_ramp.yml#conflict_relief_absence_allowance_reverted.
# New steady-state Net Operating Result: Table 1 +A$38,705.33/month (was
# +A$32,576.80 under the 2026-08-18 version), Table 2 +A$4,615.32/month (was
# -A$1,513.21, loss-making) -- **Table 2 returns to profitability at steady
# state.** Every output block below (steady_state_summary, totals_24mo,
# cash_flow_summary, breakeven, sensitivity_client_volume,
# sensitivity_insurance, scenario_comparison) was regenerated via a fresh
# live run of tools/master_financial_model.py's own compute functions
# against the corrected data/canonical/cost_ramp.yml -- not hand-derived
# separately. Insurance treatment (A$708.34/month, corrected 2026-08-18)
# is UNCHANGED by this round -- only the relief-allowance line moved.
# tests/test_master_financial_model.py and tests/test_cost_ramp.py updated
# to match, not left asserting the superseded 2026-08-18 figures.
#
# RESOLVED 2026-08-18 (Financial Finalisation round) -- two open items closed
# by investigation this round, per Anthony's explicit "investigate, don't ask
# Anthony to pick" instruction. (1) INSURANCE: traced both A$400/month and
# A$1,279/month back to their origins -- the A$1,279 figure was found to be
# methodologically flawed (double-counted workers compensation, included an
# optional business-interruption line). Corrected to A$708.34/month (the
# genuinely-needed, non-double-counted Public Liability + Professional
# Indemnity + Property/Contents components, externally sanity-checked).
# (2) RELIEF/ABSENCE COVERAGE: added a new, quantified recurring line
# (A$6,128.53/month) representing the real expected cost of relief staff
# covering absences -- the payroll model previously priced only the
# committed roster with zero absences, ever. Full investigation:
# docs/architecture/FINANCIAL-ASSUMPTION-REGISTER.md. New steady-state Net
# Operating Result: Table 1 +A$32,576.80/month (was +A$39,013.67), Table 2
# -A$1,513.21/month (was +A$4,923.66) -- **Table 2 is now genuinely loss-
# making at steady state**, reported plainly. Table 1 remains solidly
# net-positive and is the sole planning case.
#
# RECOMPUTED 2026-08-17 (Phase C, second recompute this date -- SUPERSEDES
# the same-day proportional-wage-scaling recompute described immediately
# below in this banner) -- the labour cost base was rebuilt from FIRST
# PRINCIPLES (position -> headcount -> hours/shift -> operating days ->
# wage rate -> Saturday penalty -> super -> workers comp), not scaled
# proportionally from the old total. See
# docs/architecture/FIRST-PRINCIPLES-FINANCIAL-MODEL.md for the full
# derivation and tools/cost_ramp_model.py for the implementation. The PM
# average transaction value was also rebuilt from the real service/package
# mix (A$95 placeholder -> A$117 derived figure, data/canonical/pricing.yml
# #pm_alacarte_average, docs/architecture/PM-PACKAGES.md §5). Every output
# block below (steady_state_summary, totals_24mo, cash_flow_summary,
# breakeven, sensitivity_client_volume, sensitivity_insurance,
# scenario_comparison, funding_requirement_investigation cross-checks) was
# regenerated via a fresh live run of tools/master_financial_model.py's own
# compute functions against the new data/canonical/cost_ramp.yml and
# data/canonical/revenue_ramp.yml -- not hand-derived separately. NEW
# headline steady-state Net Operating Result: Table 1 +A$48,851.68/month
# (was +A$53,837.02 under the proportional-scaling recompute, +A$56,581.70
# before that), Table 2 +A$14,761.66/month (was +A$18,462.37, +A$21,056.64
# before that) -- both DOWN again, because first-principles labour costing
# (particularly the Venue Manager's real 8hr AM+admin day and PM
# Reception's real headcount, previously both modelled as small flat
# allowances) is materially higher than the proportional-scaled bridge
# figure, only partly offset by the new, higher PM revenue base.
#
# PRIOR SAME-DAY BANNER TEXT (retained for trace, not deleted): "RECOMPUTED
# 2026-08-17 -- the 2026-08-16 current-wage-rate research
# (financial-break-even-staff.md/hr-framework.md) and the revised insurance
# placeholder (opex.yml, A$400 -> A$1,279/month) are now propagated through
# to every output block below... NEW headline steady-state Net Operating
# Result: Table 1 +A$53,837.02/month (was +A$56,581.70), Table 2
# +A$18,462.37/month (was +A$21,056.64) -- both DOWN, because the wage
# increases outweigh the small insurance-placeholder-driven saving."
#
# Combines the canonical revenue methodology (docs/architecture/CANONICAL-REVENUE-METHODOLOGY.md),
# revenue_ramp.yml, and cost_ramp.yml into a 24-month P&L, basic cash flow, break-even,
# scenario comparison, and sensitivity analysis. Deterministically generated by
# tools/master_financial_model.py -- every revenue/cost figure below traces to a
# data/canonical/revenue_ramp.yml or data/canonical/cost_ramp.yml record by id, not a
# second, hidden calculation. Reproduced exactly by tests/test_master_financial_model.py.
#
# Priority order for this phase, per the coordinator's explicit instruction: correctness >
# traceability > reproducibility > transparency > scenario separation > auditability >
# presentation (presentation is explicitly out of scope this phase).
#
# Does NOT calculate: EBITDA, EBIT (undefined terms in this repo), opening funding
# requirement, NPV, IRR, investor return. Does NOT choose Table 1 or Table 2 as primary.
#
# Full detail, worked examples, and every disclosed limitation:
# docs/architecture/MASTER-FINANCIAL-MODEL-METHODOLOGY.md
#
# Status vocabulary: VERIFIED | DECIDED | CALCULATED | MODELLED | SCENARIO |
# PLACEHOLDER | SUPERSEDED -- see docs/architecture/DATA-GOVERNANCE.md.

