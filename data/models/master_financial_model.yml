      "data/canonical/pricing.yml#am_price_used_for_revenue, #pm_alacarte_average",
    ]
  - id: trace_table1_m12_payroll
    output: "Table 1 Month 12 Payroll"
    chain: [
      "outputs.steady_state_summary (this file)",
      "data/canonical/cost_ramp.yml#cost_table1_m5plus.payroll_breakdown",
      "data/canonical/staffing.yml (headcount) + data/canonical/wages.yml (rates)",
      "data/canonical/wages.yml#wage_casual_minimum_engagement (the 3-hour floor governing PM labor)",
