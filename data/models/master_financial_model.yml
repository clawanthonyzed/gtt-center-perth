    disclosed §7.1/§7.2/§7.3 sub-totals -- confirmed to decompose exactly (7.3's own components,
    legal/lease A$19,600-27,600 + working capital reserve A$85,000-110,000 + insurance
    A$400-400, sum to exactly A$105,000-138,000, matching CURRENT-STATE.md's own stated 7.3
    total to the dollar). No new figure was invented -- this is a re-partition of an existing,
    already-canonical total, not a new calculation. A single EXACT figure is NOT established,
    because the underlying startup-cost reconciliation itself remains genuinely unresolved
    (6-9 distinct historical ranges, none singularly authoritative) -- see
    docs/architecture/STARTUP-COST-RECONCILIATION.md, unchanged by this investigation.

